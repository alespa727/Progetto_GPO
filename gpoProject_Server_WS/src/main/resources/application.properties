
spring.application.name=gpoProject_Server_WS

server.port=8081

# Servizio Database
spring.datasource.url=jdbc:mysql://localhost:3306/progetto_gpo
spring.datasource.username=root
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false


# Specifica il nome e il percorso del file di log
logging.file.name=logs/applicazione.log

# Pattern per il file: %ex scrive l'eccezione completa (stack trace)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n%ex
