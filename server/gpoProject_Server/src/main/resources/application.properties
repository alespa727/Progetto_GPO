# Specifica la porta (cambiala per ogni server, es. 8443, 8081, 8082...)
server.port=8080

app.upload.dir.images=./uploads/images
app.upload.dir.files=./uploads/files

client.port=http://localhost:5173

# Massimo di upload dei file
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1GB

# Servizio Database
spring.datasource.url=jdbc:mysql://localhost:3306/progetto_GPO
spring.datasource.username=root
spring.datasource.password=

# Metti validate(controlla che ci siano gia le tabelle)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

