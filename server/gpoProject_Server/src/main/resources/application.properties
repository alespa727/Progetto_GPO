# Porta del server (Railway fornisce la porta tramite variabile d'ambiente, altrimenti 8080)
server.port=${PORT:8080}
client.port=${CLIENT_PORT:*}
# Percorsi standard
standard.server.path=http://localhost:${PORT:8080}
standard.files.path=/files/
standard.image.path=/images/

# Directory upload (Railway permette solo /tmp, fallback alle cartelle locali se possibile)
app.upload.dir.images=${UPLOAD_IMAGES_DIR:./uploads/images}
app.upload.dir.files=${UPLOAD_FILES_DIR:./uploads/files}

# Massimo di upload dei file
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1GB

# Servizio Database (usa le variabili d'ambiente di Railway, altrimenti fallback locale)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/progetto_gpo}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

